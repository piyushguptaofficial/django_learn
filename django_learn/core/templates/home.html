<html>
<body>
    <h1>Product Catalog</h1>
    <a href="{% url 'add_product' %}">Add New Product</a>
    <ul>
        {% for product in products %}
        <li>
            <strong>{{ product.name }}</strong> - ₹{{ product.price }}<br>
            {{ product.description }}
        </li>
        {% endfor %}
</ul>
</body>
</html>
